<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#efe9dc"/>
        <stop offset="1" stop-color="#d6cdb8"/>
      </linearGradient>
      <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
        <stop offset="0" stop-color="#cbb287" stop-opacity="0.5"/>
        <stop offset="1" stop-color="#cbb287" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#a3977d"/>
        <stop offset="0.18" stop-color="#cfc4ab"/>
        <stop offset="0.5" stop-color="#cfc4ab" stop-opacity="0.85"/>
        <stop offset="0.82" stop-color="#a3977d"/>
        <stop offset="1" stop-color="#a3977d"/>
      </linearGradient>
      <linearGradient id="liquidG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#cfc4ab" stop-opacity="0.95"/>
        <stop offset="1" stop-color="#a3977d"/>
      </linearGradient>
      <linearGradient id="capG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#4a4238" stop-opacity="0.7"/>
        <stop offset="0.5" stop-color="#4a4238"/>
        <stop offset="1" stop-color="#4a4238" stop-opacity="0.65"/>
      </linearGradient>
      <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#000" stop-opacity="0"/>
      </linearGradient>
      <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
      <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
    </defs>
    <rect width="800" height="1000" fill="url(#bg)"/>
    <rect width="800" height="1000" fill="url(#glow)"/>
    <line x1="60" y1="0" x2="-100" y2="1000" stroke="#fff" stroke-opacity="0.025" stroke-width="1"/><line x1="150" y1="0" x2="-10" y2="1000" stroke="#fff" stroke-opacity="0.025" stroke-width="1"/><line x1="240" y1="0" x2="80" y2="1000" stroke="#fff" stroke-opacity="0.025" stroke-width="1"/><line x1="330" y1="0" x2="170" y2="1000" stroke="#fff" stroke-opacity="0.025" stroke-width="1"/><line x1="420" y1="0" x2="260" y2="1000" stroke="#fff" stroke-opacity="0.025" stroke-width="1"/><line x1="510" y1="0" x2="350" y2="1000" stroke="#fff" stroke-opacity="0.025" stroke-width="1"/><line x1="600" y1="0" x2="440" y2="1000" stroke="#fff" stroke-opacity="0.025" stroke-width="1"/><line x1="690" y1="0" x2="530" y2="1000" stroke="#fff" stroke-opacity="0.025" stroke-width="1"/><line x1="780" y1="0" x2="620" y2="1000" stroke="#fff" stroke-opacity="0.025" stroke-width="1"/>
  
    <g transform="translate(400 830) scale(1)">
      <!-- shadow -->
      <ellipse cx="0" cy="14" rx="150" ry="26" fill="#000" opacity="0.5" filter="url(#soft)"/>
      <!-- body -->
      <path d="M -118 0 L -118 -300 Q -118 -330 -88 -330 L 88 -330 Q 118 -330 118 -300 L 118 0 Q 118 26 92 26 L -92 26 Q -118 26 -118 0 Z"
        fill="url(#liquidG)" opacity="0.92"/>
      <path d="M -118 0 L -118 -300 Q -118 -330 -88 -330 L -60 -330 L -60 26 L -92 26 Q -118 26 -118 0 Z"
        fill="#a3977d" opacity="0.55"/>
      <!-- glass highlight -->
      <rect x="-96" y="-318" width="26" height="330" rx="13" fill="#fff" opacity="0.28" filter="url(#soft2)"/>
      <rect x="58" y="-300" width="10" height="300" rx="5" fill="#fff" opacity="0.12" filter="url(#soft2)"/>
      <!-- shoulder/neck -->
      <rect x="-34" y="-430" width="68" height="104" fill="url(#glassG)"/>
      <rect x="-34" y="-430" width="14" height="104" fill="#fff" opacity="0.2" filter="url(#soft2)"/>
      <!-- collar -->
      <rect x="-46" y="-452" width="92" height="26" rx="6" fill="url(#capG)"/>
      <!-- cap -->
      <rect x="-52" y="-640" width="104" height="192" rx="10" fill="url(#capG)"/>
      <rect x="-52" y="-640" width="16" height="192" rx="8" fill="#fff" opacity="0.22" filter="url(#soft2)"/>
      <rect x="-52" y="-560" width="104" height="4" fill="#000" opacity="0.18"/>
      <rect x="-52" y="-470" width="104" height="4" fill="#000" opacity="0.18"/>
      <!-- label -->
      <rect x="-84" y="-240" width="168" height="150" fill="#f4efe6" opacity="0.96"/>
      <rect x="-84" y="-240" width="168" height="150" fill="none" stroke="#4a4238" stroke-opacity="0.4" stroke-width="1"/>
      <text x="0" y="-196" text-anchor="middle" font-family="Georgia" font-size="26" letter-spacing="6" fill="#1c1a17">SANTAL</text>
      <line x1="-52" y1="-176" x2="52" y2="-176" stroke="#4a4238" stroke-width="1" opacity="0.7"/>
      <text x="0" y="-158" text-anchor="middle" font-family="Arial" font-size="11" letter-spacing="4" fill="#6b6459">EAU DE PARFUM</text>
      <text x="0" y="-120" text-anchor="middle" font-family="Arial" font-size="9" letter-spacing="2" fill="#8a8172">Santal · Cuir · Mousse</text>
    </g>
  
    <rect x="0" y="880" width="800" height="120" fill="url(#floorG)"/>
    <rect width="800" height="1000" fill="none" stroke="#000" stroke-opacity="0.25"/>
    <rect x="24" y="24" width="752" height="952" fill="none" stroke="#fff" stroke-opacity="0.06"/>
  </svg>